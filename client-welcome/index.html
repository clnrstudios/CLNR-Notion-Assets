<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLNR / Client Welcome</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500;600&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,90,600&display=swap" rel="stylesheet"><style>:root{--ink:#0B0B0C;--paper:#fff;--red:#FF3B1F;--line:#E4E5E8;--mute:#7C8085}*{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--ink)}body{font-family:"Azeret Mono",monospace}.w{min-height:300px;background:var(--paper);border:1px solid var(--line);padding:24px;position:relative}.top{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute)}.brand{color:var(--ink)}.hero{margin:48px 0 32px}.eyebrow{font-size:9px;letter-spacing:.13em;color:var(--red);text-transform:uppercase;margin-bottom:10px}.title{font-family:"Bricolage Grotesque",sans-serif;font-size:clamp(36px,6vw,64px);font-weight:600;letter-spacing:-.055em;line-height:.92}.sub{margin-top:12px;font-size:12px;color:var(--mute)}.grid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}.c{padding-top:13px}.c b{display:block;font-size:8px;letter-spacing:.12em;color:var(--mute);margin-bottom:6px}.c span{font-size:11px}.corner{position:absolute;right:10px;top:10px;width:18px;height:18px;border-top:1px solid var(--ink);border-right:1px solid var(--ink);opacity:.28}@media(max-width:600px){.grid{grid-template-columns:1fr;gap:12px}}</style></head><body><main class="w"><div class="corner"></div><div class="top"><span class="brand">CLNR STUDIOS</span><span>CLIENT PRODUCTION PORTAL</span></div><div class="hero"><div class="eyebrow" id="client">CLIENT × CLNR</div><div class="title" id="series">SERIES NAME</div><div class="sub" id="intro">Your production workspace for planning, shooting, review and delivery.</div></div><div class="grid"><div class="c"><b>PRODUCER</b><span id="producer">CLNR STUDIOS</span></div><div class="c"><b>CURRENT PHASE</b><span id="phase">PRE-PRODUCTION</span></div><div class="c"><b>NEXT MILESTONE</b><span id="milestone">SHOOT DAY</span></div></div></main><script>const q=new URLSearchParams(location.search),set=(id,key,d)=>document.getElementById(id).textContent=(q.get(key)||d).toUpperCase();set('client','client','CLIENT × CLNR');set('series','series','SERIES NAME');document.getElementById('intro').textContent=q.get('intro')||'Your production workspace for planning, shooting, review and delivery.';set('producer','producer','CLNR STUDIOS');set('phase','phase','PRE-PRODUCTION');set('milestone','milestone','SHOOT DAY');</script></body></html>
