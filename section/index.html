<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light">
<title>CLNR / Section</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500;600&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,90,600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B0B0C;--paper:#FFFFFF;--mute:#7C8085;--line:#E4E5E8;--red:#FF3B1F;--teal:#1E3A36}
*{box-sizing:border-box}html,body{margin:0;background:transparent}body{font-family:"Azeret Mono",ui-monospace,monospace;color:var(--ink)}
.shell{position:relative;width:100%;min-height:116px;background:var(--paper);border-top:1px solid var(--ink);border-bottom:1px solid var(--line);padding:16px 20px 18px;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute)}
.mode{color:var(--ink)}.state{display:flex;align-items:center;gap:8px}.dot{display:none;width:7px;height:7px;border-radius:50%;background:var(--red)}
.main{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-top:20px}.left{display:flex;align-items:baseline;gap:18px;min-width:0}.num{font-size:12px;letter-spacing:.08em;color:var(--mute);white-space:nowrap}.title{font-family:"Bricolage Grotesque",Arial,sans-serif;font-size:clamp(27px,4.2vw,45px);font-weight:600;line-height:.9;letter-spacing:-.045em;white-space:nowrap}.meta{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);white-space:nowrap;padding-bottom:2px}
.corner{position:absolute;right:10px;top:10px;width:18px;height:18px;border-right:1px solid var(--line);border-top:1px solid var(--line)}
.shell.monitor{background:var(--teal);color:var(--paper);border-color:var(--teal)}.monitor .top,.monitor .num,.monitor .meta{color:rgba(255,255,255,.66)}.monitor .mode{color:var(--paper)}.monitor .corner{border-color:rgba(255,255,255,.28)}
.shell.live .dot{display:inline-block}.shell.live{border-top-color:var(--red)}
@media(max-width:620px){.shell{min-height:106px;padding:14px 16px}.main{margin-top:18px}.left{gap:11px}.title{font-size:28px}.meta{display:none}}
</style>
</head>
<body><main class="shell" id="shell"><div class="corner"></div><div class="top"><span class="mode" id="mode">CLNR / VIEWFINDER</span><span class="state"><i class="dot"></i><span id="state">PRODUCTION SYSTEM</span></span></div><div class="main"><div class="left"><span class="num" id="num">01</span><span class="title" id="title">SECTION</span></div><span class="meta" id="meta">ACTIVE WORK</span></div></main>
<script>
const q=new URLSearchParams(location.search), get=(k,d)=>(q.get(k)||d).toUpperCase();
const mode=get('mode','viewfinder'), shell=document.getElementById('shell');
document.getElementById('mode').textContent='CLNR / '+mode;
document.getElementById('num').textContent=get('n','01');document.getElementById('title').textContent=get('title','SECTION');document.getElementById('meta').textContent=get('meta','ACTIVE WORK');document.getElementById('state').textContent=get('state','PRODUCTION SYSTEM');
if(mode==='MONITOR')shell.classList.add('monitor');if(q.get('live')==='1')shell.classList.add('live');
</script></body></html>
