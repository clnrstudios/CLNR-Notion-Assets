<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLNR / Client Intake</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500;600&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,90,600&display=swap" rel="stylesheet"><style>:root{--ink:#0B0B0C;--paper:#fff;--mute:#7C8085;--line:#E4E5E8;--red:#FF3B1F;--teal:#1E3A36}*{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--ink)}body{font-family:"Azeret Mono",monospace}.shell{width:100%;background:var(--paper);border:1px solid var(--line);padding:16px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:12px}.eyebrow,.meta{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute)}h1{font-family:"Bricolage Grotesque",Arial,sans-serif;font-size:clamp(24px,3vw,34px);line-height:.95;letter-spacing:-.04em;margin:5px 0 0;font-weight:600}.grid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}.card{position:relative;min-height:112px;padding:13px 14px 12px;text-decoration:none;color:var(--ink);border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;display:flex;flex-direction:column;justify-content:space-between;transition:transform .16s ease,background .16s ease}.card:hover{background:#f7f7f7;transform:translateY(-1px)}.card.dark{background:var(--ink);color:#fff}.card.dark:hover{background:#181819}.card.teal{background:var(--teal);color:#fff}.card.teal:hover{background:#274843}.top{display:flex;justify-content:space-between;gap:10px;font-size:8px;letter-spacing:.12em;text-transform:uppercase}.status{color:var(--mute)}.dark .status,.teal .status{color:rgba(255,255,255,.58)}.num{opacity:.55}.title{font-family:"Bricolage Grotesque",Arial,sans-serif;font-size:clamp(16px,1.7vw,21px);font-weight:600;letter-spacing:-.025em;line-height:1}.desc{font-size:8px;line-height:1.45;letter-spacing:.03em;color:var(--mute);margin-top:5px;max-width:34ch}.dark .desc,.teal .desc{color:rgba(255,255,255,.62)}.action{margin-top:10px;font-size:8px;letter-spacing:.12em;text-transform:uppercase}.action:after{content:'  →'}.card.disabled{cursor:default}.card.disabled .action{color:var(--mute)}.card.disabled .action:after{content:''}.tally{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-right:7px;vertical-align:1px;animation:blink 1.4s steps(1,end) infinite}@keyframes blink{50%{opacity:.3}}@media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}.head{align-items:flex-start;flex-direction:column}.meta{display:none}}@media(max-width:440px){.grid{grid-template-columns:1fr}}</style></head><body><main class="shell"><div class="head"><div><div class="eyebrow">CLNR / START HERE</div><h1>Client Intake + Immediate Links</h1></div><div class="meta"><span class="tally"></span>ONBOARDING / SERIES SETUP</div></div><div class="grid" id="grid"></div></main><script>const q=new URLSearchParams(location.search);const items=[['01','Series Intake','Strategy, goals, audience and series direction.','series','REQUIRED','dark'],['02','Upload Files','Raw footage, logos, brand files and source assets.','upload','REQUIRED',''],['03','Brand Assets','Brand deck, fonts, colors and approved identity files.','brand','REQUIRED',''],['04','Team + Access','Stakeholders, approvals, access and production contacts.','team','SETUP',''],['05','Creative References','Inspiration, competitors, visual references and examples.','refs','OPTIONAL',''],['06','Review + Approvals','Open the client review workspace and current cuts.','review','ACTIVE','teal']];const grid=document.getElementById('grid');for(const [n,title,desc,key,status,tone] of items){const url=q.get(key)||'';const a=document.createElement(url?'a':'div');a.className='card '+tone+(url?'':' disabled');if(url){a.href=url;a.target='_blank';a.rel='noopener'}a.innerHTML=`<div class="top"><span class="num">${n}</span><span class="status">${status}</span></div><div><div class="title">${title}</div><div class="desc">${desc}</div><div class="action">${url?'OPEN':'SET LINK'}</div></div>`;grid.appendChild(a)}</script></body></html>
