<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLNR / Post House</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500;600&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,90,600&display=swap" rel="stylesheet"><style>:root{--ink:#0B0B0C;--paper:#fff;--red:#FF3B1F;--line:#2b2b2d;--mute:#9b9b9f}*{box-sizing:border-box}html,body{margin:0;background:transparent}body{font-family:"Azeret Mono",monospace}.w{min-height:250px;background:var(--ink);color:#fff;padding:22px 24px;border:1px solid var(--ink);position:relative}.top{display:flex;justify-content:space-between;align-items:center;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute)}.dot{width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block;margin-right:8px}.title{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:clamp(30px,5vw,54px);letter-spacing:-.05em;margin:32px 0 18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}.c{padding:14px 12px 0 0}.c b{display:block;color:#7d7d82;font-size:8px;letter-spacing:.12em;margin-bottom:7px}.c span{font-size:11px}.bar{height:3px;background:#27272a;margin-top:28px;position:relative;overflow:hidden}.fill{height:100%;width:62%;background:var(--red);animation:load .7s ease both}@keyframes load{from{width:0}}.foot{display:flex;justify-content:space-between;margin-top:11px;font-size:8px;letter-spacing:.1em;color:#77777b}.corner{position:absolute;right:10px;top:10px;width:18px;height:18px;border-top:1px solid #555;border-right:1px solid #555}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}}</style></head><body><main class="w"><div class="corner"></div><div class="top"><span>CLNR / POST HOUSE</span><span><i class="dot"></i><span id="state">CUT IN PROGRESS</span></span></div><div class="title" id="title">EP 04 · V1</div><div class="grid"><div class="c"><b>EDITOR</b><span id="editor">ASSIGNED</span></div><div class="c"><b>COLOR</b><span id="color">IN PROGRESS</span></div><div class="c"><b>AUDIO</b><span id="audio">PENDING</span></div><div class="c"><b>REVIEW</b><span id="review">NOT SENT</span></div></div><div class="bar"><div class="fill" id="fill"></div></div><div class="foot"><span id="pct">62% COMPLETE</span><span>POST / MONITOR</span></div></main><script>const q=new URLSearchParams(location.search),set=(id,key,d)=>document.getElementById(id).textContent=(q.get(key)||d).toUpperCase();set('state','state','CUT IN PROGRESS');set('title','title','EP 04 · V1');set('editor','editor','ASSIGNED');set('color','color','IN PROGRESS');set('audio','audio','PENDING');set('review','review','NOT SENT');const p=Math.max(0,Math.min(100,Number(q.get('progress')||62)));document.getElementById('fill').style.width=p+'%';document.getElementById('pct').textContent=p+'% COMPLETE';</script></body></html>
