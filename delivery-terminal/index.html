<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLNR / Delivery Terminal</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500;600&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,90,600&display=swap" rel="stylesheet"><style>:root{--ink:#0B0B0C;--paper:#fff;--red:#FF3B1F;--teal:#1E3A36;--line:#dfe3e2;--mute:#71807d}*{box-sizing:border-box}html,body{margin:0;background:transparent}body{font-family:"Azeret Mono",monospace}.w{min-height:240px;background:#f8faf9;color:var(--ink);border:1px solid var(--line);padding:22px 24px;position:relative}.top{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute)}.ok{display:flex;gap:8px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:var(--teal)}.title{font-family:"Bricolage Grotesque",sans-serif;font-size:clamp(30px,5vw,50px);font-weight:600;letter-spacing:-.05em;margin:34px 0 18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}.c{padding-top:13px}.c b{display:block;font-size:8px;letter-spacing:.12em;color:var(--mute);margin-bottom:6px}.c span{font-size:11px}.tag{display:inline-block;background:var(--teal);color:#fff;padding:5px 8px;font-size:8px;letter-spacing:.1em;text-transform:uppercase}.corner{position:absolute;right:10px;top:10px;width:18px;height:18px;border-top:1px solid var(--teal);border-right:1px solid var(--teal);opacity:.5}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}}</style></head><body><main class="w"><div class="corner"></div><div class="top"><span>CLNR / DELIVERY TERMINAL</span><span class="ok"><i class="dot"></i><span id="state">APPROVED FINAL</span></span></div><div class="title" id="title">EP 01 · FINAL EXPORT</div><div class="grid"><div class="c"><b>PLATFORM</b><span id="platform">INSTAGRAM</span></div><div class="c"><b>RELEASE</b><span id="release">SEP 22</span></div><div class="c"><b>EXPORT</b><span id="export">4K H.264</span></div><div class="c"><b>STATUS</b><span class="tag" id="status">READY</span></div></div></main><script>const q=new URLSearchParams(location.search),set=(id,key,d)=>document.getElementById(id).textContent=(q.get(key)||d).toUpperCase();set('state','state','APPROVED FINAL');set('title','title','EP 01 · FINAL EXPORT');set('platform','platform','INSTAGRAM');set('release','release','SEP 22');set('export','export','4K H.264');set('status','status','READY');</script></body></html>
