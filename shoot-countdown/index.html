<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLNR / Shoot Countdown</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500;600&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,90,600&display=swap" rel="stylesheet"><style>:root{--ink:#0B0B0C;--paper:#fff;--red:#FF3B1F;--teal:#1E3A36;--line:#E4E5E8;--mute:#7C8085}*{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--ink)}body{font-family:"Azeret Mono",monospace}.w{position:relative;min-height:250px;background:var(--paper);border:1px solid var(--line);padding:22px 24px;overflow:hidden}.top,.foot{display:flex;justify-content:space-between;align-items:center;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute)}.live{display:flex;gap:8px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:var(--red);animation:p 1s steps(1) infinite}@keyframes p{50%{opacity:.25}}.big{font-size:clamp(44px,8vw,82px);line-height:.9;letter-spacing:-.065em;margin:34px 0 12px;font-variant-numeric:tabular-nums}.label{font-family:"Bricolage Grotesque",sans-serif;font-size:18px;font-weight:600}.meta{margin-top:26px;border-top:1px solid var(--line);padding-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.m b{display:block;font-size:8px;letter-spacing:.12em;color:var(--mute);text-transform:uppercase;margin-bottom:6px}.m span{font-size:11px}.corner{position:absolute;right:10px;top:10px;width:18px;height:18px;border-top:1px solid var(--ink);border-right:1px solid var(--ink);opacity:.3}.now .w{background:var(--red);color:#fff;border-color:var(--red)}.now .top,.now .foot,.now .m b{color:rgba(255,255,255,.72)}.now .meta{border-color:rgba(255,255,255,.35)}.now .dot{background:var(--ink)}.now .corner{border-color:#fff}@media(max-width:600px){.meta{grid-template-columns:1fr}.big{font-size:48px}}</style></head><body><main class="w"><div class="corner"></div><div class="top"><span>CLNR / SHOOT COUNTDOWN</span><span class="live"><i class="dot"></i><span id="state">CALL LOCKED</span></span></div><div class="big" id="count">00D 00H 00M</div><div class="label" id="title">NEXT SHOOT</div><div class="meta"><div class="m"><b>EPISODE</b><span id="ep">EP 03</span></div><div class="m"><b>CALL TIME</b><span id="call">09:00 AM</span></div><div class="m"><b>LOCATION</b><span id="loc">STUDIO A</span></div></div></main><script>const q=new URLSearchParams(location.search);const target=q.get('date')||'2026-09-18T09:00:00-07:00';const ep=q.get('episode')||'EP 03',call=q.get('call')||'09:00 AM',loc=q.get('location')||'STUDIO A';ep&&(document.getElementById('ep').textContent=ep.toUpperCase());document.getElementById('call').textContent=call.toUpperCase();document.getElementById('loc').textContent=loc.toUpperCase();function tick(){const d=new Date(target)-new Date();if(d<=0){document.body.classList.add('now');document.getElementById('count').textContent='● LIVE';document.getElementById('title').textContent='PRODUCTION ACTIVE';document.getElementById('state').textContent='CAMERA ROLLING';return}const days=Math.floor(d/864e5),hrs=Math.floor(d%864e5/36e5),mins=Math.floor(d%36e5/6e4);document.getElementById('count').textContent=`${String(days).padStart(2,'0')}D ${String(hrs).padStart(2,'0')}H ${String(mins).padStart(2,'0')}M`}tick();setInterval(tick,1000)</script></body></html>
