<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLNR / Production Progress</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500;600&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,90,600&display=swap" rel="stylesheet"><style>:root{--ink:#0B0B0C;--paper:#fff;--mute:#7C8085;--line:#E4E5E8;--red:#FF3B1F}*{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--ink)}body{font-family:"Azeret Mono",monospace}.shell{position:relative;width:100%;height:94px;background:var(--paper);border:1px solid var(--line);padding:10px 22px 9px;overflow:hidden}.top{height:13px;display:flex;justify-content:space-between;align-items:center;text-transform:uppercase;font-size:8px;letter-spacing:.14em;color:var(--mute)}.live{display:flex;align-items:center;gap:7px}.dot{width:6px;height:6px;border-radius:50%;background:var(--red);animation:blink 1s steps(1,end) infinite}@keyframes blink{50%{opacity:.25}}.stages{height:43px;display:grid;grid-template-columns:repeat(4,1fr);align-items:end;margin-top:4px}.stage{min-width:0}.num{font-size:7px;letter-spacing:.1em;color:var(--mute);margin-bottom:2px}.name{font-family:"Bricolage Grotesque",Arial,sans-serif;font-size:clamp(17px,2.25vw,25px);line-height:.92;font-weight:600;letter-spacing:-.035em;white-space:nowrap}.stage.active .name{color:var(--red)}.track{position:relative;height:2px;background:var(--line);margin-top:7px}.fill{position:absolute;left:0;top:0;height:100%;background:var(--red);width:0;transition:width .8s cubic-bezier(.2,.8,.2,1)}.fill:after{content:"";position:absolute;right:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px rgba(255,59,31,.08);animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,59,31,0)}}.ticks{position:absolute;left:22px;right:22px;bottom:7px;display:grid;grid-template-columns:repeat(4,1fr);pointer-events:none}.tick{width:1px;height:4px;background:var(--line)}.tick.done,.tick.active{background:var(--red)}@media(max-width:650px){.shell{height:88px;padding:9px 14px 8px}.ticks{left:14px;right:14px;bottom:6px}.name{font-size:14px}.top{font-size:7px}}</style></head><body><main class="shell"><div class="top"><span>CLNR / SERIES PIPELINE</span><span class="live"><i class="dot"></i><span id="stageLabel">PLANNING ACTIVE</span></span></div><div class="stages"><div class="stage"><div class="num">01</div><div class="name">Pre-Production</div></div><div class="stage"><div class="num">02</div><div class="name">Shooting</div></div><div class="stage"><div class="num">03</div><div class="name">Editing</div></div><div class="stage"><div class="num">04</div><div class="name">Completed</div></div></div><div class="track"><div class="fill" id="fill"></div></div><div class="ticks"><i class="tick"></i><i class="tick"></i><i class="tick"></i><i class="tick"></i></div></main><script>const map={preproduction:{i:0,p:25,s:'PLANNING ACTIVE'},shooting:{i:1,p:50,s:'PRODUCTION ACTIVE'},editing:{i:2,p:75,s:'POST ACTIVE'},completed:{i:3,p:100,s:'DELIVERED'}};const q=new URLSearchParams(location.search);const raw=(q.get('status')||'preproduction').toLowerCase().replace(/[ _-]/g,'');const key=raw==='preproduction'||raw==='preprod'?'preproduction':raw==='shoot'||raw==='filming'?'shooting':raw==='edit'||raw==='post'?'editing':raw==='complete'||raw==='done'||raw==='delivered'?'completed':raw;const cfg=map[key]||map.preproduction;document.getElementById('stageLabel').textContent=cfg.s;requestAnimationFrame(()=>document.getElementById('fill').style.width=cfg.p+'%');[...document.querySelectorAll('.stage')].forEach((el,i)=>{if(i===cfg.i)el.classList.add('active')});[...document.querySelectorAll('.tick')].forEach((el,i)=>{if(i<cfg.i)el.classList.add('done');if(i===cfg.i)el.classList.add('active')});</script></body></html>
