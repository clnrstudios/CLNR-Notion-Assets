<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLNR / Production Progress</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500;600&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,90,600&display=swap" rel="stylesheet"><style>:root{--ink:#0B0B0C;--paper:#fff;--mute:#7C8085;--line:#E4E5E8;--red:#FF3B1F;--green:#1E3A36}*{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--ink)}body{font-family:"Azeret Mono",monospace}.shell{position:relative;width:100%;background:var(--paper);border:1px solid var(--line);padding:22px 24px 20px;overflow:hidden}.shell:before,.shell:after{content:"";position:absolute;width:20px;height:20px;border-color:var(--ink);opacity:.22}.shell:before{left:10px;top:10px;border-left:1px solid;border-top:1px solid}.shell:after{right:10px;bottom:10px;border-right:1px solid;border-bottom:1px solid}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;text-transform:uppercase;font-size:9px;letter-spacing:.13em;color:var(--mute)}.live{display:flex;align-items:center;gap:8px}.dot{width:7px;height:7px;border-radius:50%;background:var(--red);animation:blink 1s steps(1,end) infinite}@keyframes blink{50%{opacity:.25}}h1{font-family:"Bricolage Grotesque",Arial,sans-serif;font-size:clamp(28px,4vw,46px);line-height:.95;letter-spacing:-.045em;margin:22px 0 26px;font-weight:600}.track{position:relative;height:2px;background:var(--line);margin:0 7px 14px}.fill{position:absolute;left:0;top:0;height:100%;background:var(--red);width:0;transition:width .8s cubic-bezier(.2,.8,.2,1)}.fill:after{content:"";position:absolute;right:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 5px rgba(255,59,31,.08);animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(255,59,31,0)}}.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:0}.stage{position:relative;padding-top:12px}.stage:before{content:"";position:absolute;top:-18px;left:0;width:8px;height:8px;border-radius:50%;background:var(--paper);border:1px solid var(--line)}.stage.done:before,.stage.active:before{background:var(--red);border-color:var(--red)}.num{font-size:8px;letter-spacing:.1em;color:var(--mute);margin-bottom:7px}.name{font-family:"Bricolage Grotesque",Arial,sans-serif;font-size:clamp(13px,1.8vw,18px);font-weight:600;letter-spacing:-.02em}.state{margin-top:5px;font-size:8px;letter-spacing:.1em;color:var(--mute);text-transform:uppercase}.stage.active .name{color:var(--red)}.stage.active .state{color:var(--ink)}.foot{display:flex;justify-content:space-between;gap:20px;margin-top:24px;padding-top:14px;border-top:1px solid var(--line);font-size:8px;letter-spacing:.11em;text-transform:uppercase;color:var(--mute)}@media(max-width:560px){.shell{padding:18px}.stages{grid-template-columns:repeat(2,1fr);row-gap:22px}.track{display:none}.stage:before{display:none}h1{margin:18px 0 20px}.foot{display:none}}</style></head><body><main class="shell"><div class="top"><span>CLNR / PRODUCTION STAGE</span><span class="live"><i class="dot"></i><span id="stageLabel">IN PROGRESS</span></span></div><h1 id="headline">Pre-Production</h1><div class="track"><div class="fill" id="fill"></div></div><div class="stages" id="stages"><div class="stage"><div class="num">01</div><div class="name">Pre-Production</div><div class="state">Plan + Lock</div></div><div class="stage"><div class="num">02</div><div class="name">Shooting</div><div class="state">Capture</div></div><div class="stage"><div class="num">03</div><div class="name">Editing</div><div class="state">Post + Review</div></div><div class="stage"><div class="num">04</div><div class="name">Completed</div><div class="state">Approved + Delivered</div></div></div><div class="foot"><span>VIEWFINDER / SERIES PIPELINE</span><span id="progressText">25% COMPLETE</span></div></main><script>const map={preproduction:{i:0,p:25,h:'Pre-Production',s:'PLANNING ACTIVE'},shooting:{i:1,p:50,h:'Shooting',s:'PRODUCTION ACTIVE'},editing:{i:2,p:75,h:'Editing',s:'POST ACTIVE'},completed:{i:3,p:100,h:'Completed',s:'DELIVERED'}};const q=new URLSearchParams(location.search);const raw=(q.get('status')||'preproduction').toLowerCase().replace(/[ _-]/g,'');const key=raw==='preproduction'||raw==='preprod'?'preproduction':raw==='shoot'||raw==='filming'?'shooting':raw==='edit'||raw==='post'?'editing':raw==='complete'||raw==='done'||raw==='delivered'?'completed':raw;const cfg=map[key]||map.preproduction;document.getElementById('headline').textContent=cfg.h;document.getElementById('stageLabel').textContent=cfg.s;document.getElementById('progressText').textContent=cfg.p+'% COMPLETE';requestAnimationFrame(()=>document.getElementById('fill').style.width=cfg.p+'%');[...document.querySelectorAll('.stage')].forEach((el,i)=>{if(i<cfg.i)el.classList.add('done');if(i===cfg.i)el.classList.add('active')});</script></body></html>
