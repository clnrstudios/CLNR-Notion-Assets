<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLNR / Episode Slate</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500;600&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,90,600&display=swap" rel="stylesheet"><style>:root{--ink:#0B0B0C;--paper:#fff;--red:#FF3B1F;--teal:#1E3A36;--line:#E4E5E8;--mute:#7C8085}*{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--ink)}body{font-family:"Azeret Mono",monospace}.slate{min-height:260px;border:1px solid var(--ink);background:var(--paper);padding:22px 24px;position:relative}.top,.bottom{display:flex;justify-content:space-between;gap:20px;font-size:9px;letter-spacing:.13em;text-transform:uppercase}.top{color:var(--mute)}.status{display:flex;gap:8px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:var(--red)}.take{font-size:clamp(42px,7vw,76px);line-height:.9;letter-spacing:-.06em;margin:34px 0 10px}.title{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:clamp(20px,3vw,32px);letter-spacing:-.04em}.grid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);margin-top:30px}.c{padding-top:13px}.c b{display:block;color:var(--mute);font-size:8px;letter-spacing:.12em;margin-bottom:6px}.c span{font-size:11px}.corner{position:absolute;right:10px;top:10px;width:18px;height:18px;border-top:1px solid var(--ink);border-right:1px solid var(--ink);opacity:.3}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}.take{font-size:48px}}</style></head><body><main class="slate"><div class="corner"></div><div class="top"><span>CLNR / EPISODE SLATE</span><span class="status"><i class="dot"></i><span id="status">EDITING</span></span></div><div class="take" id="take">A004_C001</div><div cl
