<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLNR / Review Monitor</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500;600&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,90,600&display=swap" rel="stylesheet"><style>:root{--ink:#0B0B0C;--paper:#fff;--red:#FF3B1F;--teal:#1E3A36;--line:#E4E5E8;--mute:#7C8085}*{box-sizing:border-box}html,body{margin:0;background:transparent}body{font-family:"Azeret Mono",monospace}.w{min-height:245px;background:var(--teal);color:#fff;padding:22px 24px;position:relative;border:1px solid var(--teal)}.top,.foot{display:flex;justify-content:space-between;gap:16px;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.66)}.dot{width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block;margin-right:8px}.title{font-family:"Bricolage Grotesque",sans-serif;font-size:clamp(30px,5vw,52px);font-weight:600;letter-spacing:-.05em;margin:34px 0 6px}.sub{font-size:11px;color:rgba(255,255,255,.72)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:30px;border-top:1px solid rgba(255,255,255,.25)}.c{padding-top:13px}.c b{display:block;font-size:8px;letter-spacing:.12em;color:rgba(255,255,255,.58);margin-bottom:6px}.c span{font-size:11px}.state{color:#fff}.corner{position:absolute;right:10px;top:10px;width:18px;height:18px;border-right:1px solid rgba(255,255,255,.4);border-top:1px solid rgba(255,255,255,.4)}@media(max-width:560px){.grid{grid-template-columns:1fr;gap:12px}}</style></head><body><main class="w"><div class="corner"></div><div class="top"><span>CLNR / REVIEW MONITOR</span><span><i class="dot"></i><span id="state">CLIENT REVIEW</span></span></div><div class="title" id="title">EP 04 · CUT V2</div><div class="sub" id="sub">DECISION REQUIRED</div><div class="grid"><div class="c"><b>REVIEWER</b><span id="reviewer">CLIENT</span></div><div class="c"><b>DEADLINE</b><span id="deadline">SEP 17</span></div><div class="c"><b>STATUS</b><span id="status">WAITING ON CLIENT</span></div></div></main><script>const q=new URLSearchParams(location.search),set=(id,key,d)=>document.getElementById(id).textContent=(q.get(key)||d).toUpperCase();set('state','state','CLIENT REVIEW');set('title','title','EP 04 · CUT V2');set('sub','sub','DECISION REQUIRED');set('reviewer','reviewer','CLIENT');set('deadline','deadline','SEP 17');set('status','status','WAITING ON CLIENT');</script></body></html>
